# Javascript Node CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/language-javascript/ for more details
#
version: 2.1
orbs:
  codecov: codecov/codecov@5.0.7
jobs:
  build:
    docker:
      # Use the newer cimg images instead of deprecated circleci images
      - image: cimg/node:22.12

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "yarn.lock" }}
            # fallback to using the latest cache if no exact match is found
            - v2-dependencies-

      - run: yarn install --frozen-lockfile

      - save_cache:
          paths:
            - node_modules
          key: v2-dependencies-{{ checksum "yarn.lock" }}

      # run tests!
      - run: yarn test --coverage --coverageDirectory=coverage
      - store_artifacts:
          path: coverage
      - codecov/upload:
          file: coverage/coverage-final.json